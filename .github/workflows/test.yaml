name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet -tags=disable_grpc_modules ./...

      - name: Vet darwin/arm64
        run: GOOS=darwin GOARCH=arm64 go vet -tags=disable_grpc_modules ./...

      - name: Test
        run: go test -race -tags=disable_grpc_modules ./...

      - name: Verify modules
        run: |
          go mod tidy -diff
          go mod verify
